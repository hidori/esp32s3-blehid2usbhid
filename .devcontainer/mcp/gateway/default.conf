# Gateway to the MCP servers on the isolated networks (see compose.yaml)

# Resolve the upstream with the Docker DNS at run time, so that nginx starts even while the upstream is down
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Only the MCP endpoints are served
    location / {
        return 404;
    }

    # Playwright (the original Host is passed, so that the server checks it against DNS rebinding)
    location = /playwright/mcp {
        set $mcp_playwright_upstream http://mcp-playwright:8931/mcp;
        proxy_pass $mcp_playwright_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }
}
