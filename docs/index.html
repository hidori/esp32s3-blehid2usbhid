<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32-S3 BLE HID to USB HID Bridge</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-content">
      <h1>ESP32-S3 BLE HID to USB HID Bridge</h1>
      <p class="status-line">
        <span id="status" class="badge">未接続</span>
        <span id="device"></span>
      </p>
    </div>
  </header>

  <main>
    <p id="unsupported" class="banner" hidden>このブラウザは WebHID に対応していません。デスクトップ版の Chrome か Edge で開いてください。</p>

    <details class="card" open>
      <summary><h2>ブリッジ</h2></summary>
      <div class="actions">
        <button id="connect" class="primary" type="button">接続</button>
        <button id="disconnect" type="button" disabled>切断</button>
      </div>
      <div class="card-footer">
        <p id="device-message" class="message"></p>
        <button id="restart" type="button" disabled>再起動</button>
      </div>
    </details>

    <details id="keyboard-card" class="card" open hidden>
      <summary><h2>BLE キーボード</h2></summary>
      <p class="registration">
        <span class="registration-label">登録</span>
        <span id="registration-name"></span>
        <span id="registration-address" class="address" hidden></span>
        <span id="registration-state" class="badge" hidden></span>
        <button id="registration-delete" class="row-action" type="button" hidden>削除</button>
      </p>
      <div class="actions">
        <button id="scan" class="primary" type="button" disabled>検索</button>
      </div>
      <div id="scan-results" class="table-wrap" hidden>
        <table class="devices">
          <thead>
            <tr>
              <th>名前</th>
              <th>アドレス</th>
              <th class="rssi">信号の強さ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="scan-devices"></tbody>
        </table>
      </div>
      <div id="pairing" class="pairing" hidden>
        <div class="pairing-body">
          <p id="pairing-status" class="pairing-status"></p>
          <div id="pairing-passkey-area" hidden>
            <p id="pairing-passkey" class="passkey"></p>
            <p class="pairing-hint">BLE キーボードでこの数字を入力し、Enter キーを押してください</p>
          </div>
        </div>
        <button id="pairing-cancel" type="button">中止</button>
      </div>
      <p id="keyboard-message" class="message"></p>
    </details>
  </main>

  <footer class="page-footer">
    <a href="https://github.com/hidori/esp32s3-blehid2usbhid" target="_blank" rel="noopener">
      <!-- mark-github-16 of Primer Octicons -->
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>
      hidori/esp32s3-blehid2usbhid
    </a>
  </footer>
</body>
</html>
