<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32-S3 BLE HID to USB HID Bridge</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>ESP32-S3 BLE HID to USB HID Bridge</h1>
    <p class="status-line">
      <span id="status" class="badge">未接続</span>
      <span id="device"></span>
    </p>
  </header>

  <main>
    <p id="unsupported" class="banner" hidden>このブラウザは WebHID に対応していません。デスクトップ版の Chrome か Edge で開いてください。</p>

    <details class="card" open>
      <summary><h2>デバイス</h2></summary>
      <div class="actions">
        <button id="connect" class="primary" type="button">接続</button>
        <button id="disconnect" type="button" disabled>切断</button>
      </div>
      <div class="card-footer">
        <p id="device-message" class="message"></p>
        <button id="restart" type="button" disabled>再起動</button>
      </div>
    </details>

    <details id="keyboard-card" class="card" open hidden>
      <summary><h2>BLE キーボード</h2></summary>
      <p class="registration">
        <span class="registration-label">登録</span>
        <span id="registration-name"></span>
        <span id="registration-address" class="address" hidden></span>
        <span id="registration-state" class="badge" hidden></span>
      </p>
      <div class="actions">
        <button id="scan" class="primary" type="button" disabled>検索</button>
      </div>
      <div id="scan-results" class="table-wrap" hidden>
        <table class="devices">
          <thead>
            <tr>
              <th>名前</th>
              <th>アドレス</th>
              <th class="rssi">信号の強さ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="scan-devices"></tbody>
        </table>
      </div>
      <div id="pairing" class="pairing" hidden>
        <div class="pairing-body">
          <p id="pairing-status" class="pairing-status"></p>
          <div id="pairing-passkey-area" hidden>
            <p id="pairing-passkey" class="passkey"></p>
            <p class="pairing-hint">BLE キーボードでこの数字を入力し、Enter キーを押してください</p>
          </div>
        </div>
        <button id="pairing-cancel" type="button">中止</button>
      </div>
      <p id="keyboard-message" class="message"></p>
    </details>
  </main>
</body>
</html>
